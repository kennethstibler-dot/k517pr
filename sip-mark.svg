<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="SIP mark">
  <!-- Reyvism layered-squares mark: three offset square outlines forming a stepped ziggurat -->
  <rect x="24" y="24" width="128" height="128" stroke="#EFBA81" stroke-width="10"/>
  <rect x="64" y="64" width="128" height="128" stroke="#966F44" stroke-width="10"/>
  <rect x="104" y="104" width="128" height="128" stroke="#161616" stroke-width="10"/>
  <!-- seat-count bars (ziggurat) inside the inner square -->
  <rect x="122" y="182" width="14" height="32" fill="#EFBA81"/>
  <rect x="146" y="160" width="14" height="54" fill="#EFBA81"/>
  <rect x="170" y="138" width="14" height="76" fill="#EFBA81"/>
  <rect x="194" y="122" width="14" height="92" fill="#EFBA81"/>
</svg>
